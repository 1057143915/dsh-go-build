# dsh-go 出包：源码就在本仓库（app/lib 已含改动），workflow 只装工具链、编运行时、打 release APK。
#
# 不再 checkout 上游再覆盖 overlay：那条路要求 overlay 里每个文件都和上游那一个提交的 API 对齐，
# 上游一升级（1.2.0 → 1.3.0 → 1.4.0）就整片编译不过，而且报的错全是"新上游调用了旧 API"，
# 看不出真因。仓库里本来就是完整源码，直接用它编。
#
# 要跟上游升级时：把上游 tarball 解进来、重放改动、一次编过，再提交（见 SKILL 的"跟上游"一节）。

name: build-apk

on:
  push:
    paths:
      - .github/workflows/build-apk.yml
      - 'app/lib/**'
      - 'app/test/**'
      - 'app/pubspec.yaml'
  workflow_dispatch:
    inputs:
      build_name:
        description: versionName（留空 = 用 pubspec.yaml）
        required: false
        default: ''
      version_code:
        description: versionCode（留空 = 按构建分钟自动算）
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成文案并下载依赖
        run: |
          cd app
          python3 tool/l10n_merge.py
          flutter pub get

      - name: 静态检查（不阻断）
        continue-on-error: true
        run: cd app && flutter analyze lib

      - name: 缓存运行时
        uses: actions/cache@v5
        with:
          path: runtime/.cache
          key: runtime-dl-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-dl-

      - name: 第一步：构建 arm64 运行时
        run: |
          chmod +x runtime/build-runtime.sh
          runtime/build-runtime.sh arm64-v8a

      - name: 校验运行时
        run: python3 -I tooling/check_runtime_bundle.py arm64

      # tawcroot 的 libtawcroot.so 在 release 构建里必须编出来（缺它 build-apk.sh 直接 die）。
      - name: 装 NDK 28.2.13676358（tawcroot 必需）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -f "$SDK/ndk/28.2.13676358/source.properties" && echo NDK_OK

      - name: 第二步：打 APK
        run: |
          chmod +x tooling/build-apk.sh
          NAME="${{ inputs.build_name }}"
          CODE="${{ inputs.version_code }}"
          # 这个仓库里的源码是 1.2.0 那版，build-apk.sh 还没有 --no-companion 选项
          # （那是 1.3.0 起才加的），传了会直接 unknown option。
          ARGS="--release -f arm64"
          [ -n "$NAME" ] && ARGS="$ARGS --build-name $NAME"
          [ -n "$CODE" ] && ARGS="$ARGS -n $CODE"
          tooling/build-apk.sh $ARGS

      - name: 输出
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/*arm64*release*.apk | head -1)
          echo "APK=$APK"
          mkdir -p /tmp/out
          cp "$APK" /tmp/out/DSH-Go-arm64-release.apk
          ls -lh /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Go-arm64-release
          path: /tmp/out/DSH-Go-arm64-release.apk
          retention-days: 7
