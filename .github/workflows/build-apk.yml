# dsh-go 出包：上游源码 + 本仓库的 overlay（只放我改过的文件）。
#
# 为什么不是把整棵树放进仓库：完整源码约 450MB，本机窄带上推不上去（56/TLS 反复断）。
# 这里 checkout 上游（GitHub 内网，快），再把 overlay/ 覆盖上去，然后照原来的步骤编译。
#
# 触发：手动（workflow_dispatch）或推这个 workflow / overlay。

name: build-apk

on:
  push:
    paths:
      - .github/workflows/build-apk.yml
      - overlay/**
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 上游 ref（默认 main）
        required: false
        default: main
      build_name:
        description: versionName（留空 = 用 pubspec.yaml）
        required: false
        default: ''
      version_code:
        description: versionCode（留空 = 按构建分钟自动算）
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: 取本仓库（overlay）
        uses: actions/checkout@v4
        with:
          path: overlay-src

      - name: 取上游源码
        uses: actions/checkout@v4
        with:
          repository: ccch1mneyyy/dsh-Go
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: src

      - name: 覆盖我的改动
        run: |
          cd overlay-src/overlay
          # 只覆盖，不删：上游新增的文件保持原样。
          find app -type f -name '*.dart' -o -type f -name '*.arb' | while read -r f; do
            mkdir -p "../../src/$(dirname "$f")"
            cp "$f" "../../src/$f"
          done
          cd ../../src
          echo "--- changed files present:"
          for f in $(cd ../overlay-src/overlay && find app -type f); do
            test -f "$f" && echo "ok $f" || { echo "MISSING $f"; exit 1; }
          done

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成文案并下载依赖
        working-directory: src
        run: |
          cd app
          python3 tool/l10n_merge.py
          flutter pub get

      - name: 静态检查（不阻断）
        continue-on-error: true
        working-directory: src
        run: cd app && flutter analyze lib

      - name: 缓存运行时
        uses: actions/cache@v5
        with:
          path: src/runtime/.cache
          key: runtime-dl-${{ hashFiles('src/runtime/build-runtime.sh', 'src/runtime/locks/**') }}
          restore-keys: runtime-dl-

      - name: 第一步：构建 arm64 运行时
        working-directory: src
        run: |
          chmod +x runtime/build-runtime.sh
          runtime/build-runtime.sh arm64-v8a

      - name: 校验运行时
        working-directory: src
        run: python3 -I tooling/check_runtime_bundle.py arm64

      # tawcroot 的 libtawcroot.so 在 release 构建里必须编出来（缺它 build-apk.sh 直接 die）。
      - name: 装 NDK 28.2.13676358（tawcroot 必需）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -f "$SDK/ndk/28.2.13676358/source.properties" && echo NDK_OK

      - name: 第二步：打 APK
        working-directory: src
        run: |
          chmod +x tooling/build-apk.sh
          NAME="${{ inputs.build_name }}"
          CODE="${{ inputs.version_code }}"
          # 上游 1.3.0 起 release 默认要求带授权的鲸鱼伙伴包（~/keys/dsh-go/...）；
          # 这台机器没有那份授权文件，所以显式 --no-companion（伙伴小屋仍可自己导入模型）。
          ARGS="--release -f arm64 --no-companion"
          [ -n "$NAME" ] && ARGS="$ARGS --build-name $NAME"
          [ -n "$CODE" ] && ARGS="$ARGS -n $CODE"
          tooling/build-apk.sh $ARGS

      - name: 输出
        working-directory: src
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/*arm64*release*.apk | head -1)
          echo "APK=$APK"
          mkdir -p /tmp/out
          cp "$APK" /tmp/out/DSH-Go-arm64-release.apk
          ls -lh /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Go-arm64-release
          path: /tmp/out/DSH-Go-arm64-release.apk
          retention-days: 7
