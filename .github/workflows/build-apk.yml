# dsh-go 出包（1.4.1 分支版）：直接 checkout 我们的 fork，编它当前 main。
#
# 为什么编 fork 而不是编这里：fork 的 Actions 被 GitHub 禁用了，编译只能放在独立仓库。
# fork 的 main = 上游 1.4.1 + 我们的改动；上游更新时在 fork 页面点一次 "Sync fork"。
#
# 触发：手动（workflow_dispatch）或推这个 workflow。

name: build-apk

on:
  push:
    paths:
      - .github/workflows/build-apk.yml
  workflow_dispatch:
    inputs:
      ref:
        description: fork 的分支或提交（默认 main）
        required: false
        default: main
      build_name:
        description: versionName（留空 = 用 pubspec.yaml）
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: 取源码（我们的 fork：上游 + 改动）
        uses: actions/checkout@v4
        with:
          repository: 1057143915/dsh-Go
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: src

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成文案并下载依赖
        working-directory: src
        run: |
          cd app
          python3 tool/l10n_merge.py
          flutter pub get

      - name: 静态检查（不阻断）
        working-directory: src
        continue-on-error: true
        run: cd app && flutter analyze lib

      - name: 缓存运行时
        uses: actions/cache@v5
        with:
          path: src/runtime/.cache
          key: runtime-dl-${{ hashFiles('src/runtime/build-runtime.sh', 'src/runtime/locks/**') }}
          restore-keys: runtime-dl-

      - name: 第一步：构建 arm64 运行时
        working-directory: src
        run: |
          chmod +x runtime/build-runtime.sh
          runtime/build-runtime.sh arm64-v8a

      - name: 校验运行时
        working-directory: src
        run: python3 -I tooling/check_runtime_bundle.py arm64

      # tawcroot 的 libtawcroot.so 在 release 构建里必须编出来；runner 自带的
      # ANDROID_NDK_HOME 指向旧版，装上钉死版本再改指过去。
      - name: 装 NDK 28.2.13676358（tawcroot 必需）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -f "$SDK/ndk/28.2.13676358/source.properties" && echo NDK_OK

      - name: 第二步：打 APK
        working-directory: src
        run: |
          chmod +x tooling/build-apk.sh
          NAME="${{ inputs.build_name }}"
          # --no-companion: 伙伴素材包在 CI 上不存在（本机 keys/ 里才有），1.4.1 的
          # build-apk.sh 缺它会直接 die。
          if [ -n "$NAME" ]; then
            tooling/build-apk.sh --release -f arm64 --no-companion --build-name "$NAME"
          else
            tooling/build-apk.sh --release -f arm64 --no-companion
          fi

      - name: 输出
        working-directory: src
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/*arm64*release*.apk | head -1)
          echo "APK=$APK"
          mkdir -p /tmp/out
          cp "$APK" /tmp/out/DSH-Go-arm64-release.apk
          ls -lh /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Go-arm64-release
          path: /tmp/out/DSH-Go-arm64-release.apk
          retention-days: 7
